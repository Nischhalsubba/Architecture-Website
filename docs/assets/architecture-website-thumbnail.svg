<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Website concept thumbnail</title>
  <desc id="desc">A monochrome editorial architecture website concept with a large building image frame, project cards, and restrained typography.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#ded8cc"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfc3c1"/>
      <stop offset="1" stop-color="#707875"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#111111" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#111111"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="url(#paper)"/>

  <g transform="translate(76 70)">
    <text x="0" y="0" fill="#6f6a61" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">ARCHITECTURE / INTERIORS / SPACE</text>
    <text x="0" y="78" fill="#111111" font-family="Georgia,serif" font-size="66" font-weight="700">Architecture</text>
    <text x="0" y="140" fill="#111111" font-family="Georgia,serif" font-size="66" font-weight="700">Website Concept</text>
    <line x1="0" y1="166" x2="436" y2="166" stroke="#111111" stroke-width="2"/>
    <text x="0" y="212" fill="#5f5a52" font-family="Arial,sans-serif" font-size="20">A premium editorial direction for studios, interiors,</text>
    <text x="0" y="242" fill="#5f5a52" font-family="Arial,sans-serif" font-size="20">projects, and spatial storytelling.</text>

    <g transform="translate(0 300)">
      <rect width="196" height="50" rx="2" fill="#111111"/>
      <text x="98" y="31" text-anchor="middle" fill="#f4f1ea" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">PROJECT BRIEF</text>
      <rect x="214" width="168" height="50" rx="2" fill="none" stroke="#111111"/>
      <text x="298" y="31" text-anchor="middle" fill="#111111" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">SCAFFOLD</text>
    </g>

    <g transform="translate(0 400)" font-family="Arial,sans-serif">
      <text x="0" y="0" fill="#6f6a61" font-size="12" font-weight="800" letter-spacing="2">PLANNED EXPERIENCE</text>
      <text x="0" y="34" fill="#111111" font-size="17">Hero · Studio · Services · Projects</text>
      <text x="0" y="64" fill="#111111" font-size="17">Process · Case studies · Inquiry</text>
    </g>
  </g>

  <g transform="translate(580 58)" filter="url(#shadow)">
    <rect width="540" height="514" rx="6" fill="#f9f8f4"/>
    <rect x="24" y="22" width="492" height="42" fill="#f9f8f4"/>
    <text x="24" y="48" fill="#111111" font-family="Arial,sans-serif" font-size="17" font-weight="900" letter-spacing="2">ATELIER / 01</text>
    <text x="362" y="48" fill="#6f6a61" font-family="Arial,sans-serif" font-size="12">PROJECTS  STUDIO  CONTACT</text>

    <g transform="translate(24 82)">
      <rect width="492" height="256" fill="url(#building)"/>
      <rect x="86" y="26" width="260" height="230" fill="#d9dbd7" opacity="0.82"/>
      <rect x="118" y="54" width="44" height="168" fill="#7e8581"/>
      <rect x="180" y="54" width="44" height="168" fill="#8f9692"/>
      <rect x="242" y="54" width="44" height="168" fill="#747c78"/>
      <rect x="304" y="54" width="18" height="168" fill="#9da39f"/>
      <rect x="0" y="214" width="492" height="42" fill="#4f5652" opacity="0.6"/>
      <text x="24" y="240" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">RESIDENTIAL / KATHMANDU / 2026</text>
    </g>

    <g transform="translate(24 360)">
      <text x="0" y="0" fill="#6f6a61" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2">SELECTED WORK</text>
      <text x="0" y="38" fill="#111111" font-family="Georgia,serif" font-size="32" font-weight="700">Spaces shaped around</text>
      <text x="0" y="72" fill="#111111" font-family="Georgia,serif" font-size="32" font-weight="700">light, material, and life.</text>
      <line x1="0" y1="98" x2="492" y2="98" stroke="#c7c1b6"/>
      <text x="0" y="128" fill="#5f5a52" font-family="Arial,sans-serif" font-size="13">01  Mountain House</text>
      <text x="174" y="128" fill="#5f5a52" font-family="Arial,sans-serif" font-size="13">02  Courtyard Studio</text>
      <text x="352" y="128" fill="#5f5a52" font-family="Arial,sans-serif" font-size="13">03  Urban Retreat</text>
    </g>
  </g>

  <text x="1120" y="586" text-anchor="end" fill="#6f6a61" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="3">NISCHHALSUBBA / ARCHITECTURE-WEBSITE</text>
</svg>